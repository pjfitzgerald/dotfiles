# Kitty configuration -- OMARCHY variant.
#
# install.sh symlinks this to ~/.config/kitty/kitty.conf on Omarchy; macOS and
# WSL get kitty/kitty.conf instead. The split exists for the `include` below:
# Omarchy keeps the active theme in ~/.local/state/omarchy/current/theme and
# every themed app pulls its colours from there. Linking the plain (mac)
# config here would drop that include and leave the terminal unthemed.
#
# Keep non-colour settings (font, keybinds, scrollback) in sync with
# kitty/kitty.conf by hand -- they are intentionally separate files, not a
# base + override pair, because kitty has no conditional include.

include ~/.local/state/omarchy/current/theme/kitty.conf

# Font
font_family JetBrainsMono Nerd Font
bold_italic_font auto
font_size 9.0

# Window
window_padding_width 14
hide_window_decorations yes
confirm_os_window_close 0

# Keybindings
map ctrl+insert copy_to_clipboard
map shift+insert paste_from_clipboard
# Send Shift+Enter as CSI-u so TUIs can distinguish it from Enter.
map shift+enter send_text all \e[13;2u
# Kitty legacy encoding sends Alt+Shift+Enter the same as Alt+Enter; send CSI-u so tmux can match M-S-Enter.
map alt+shift+enter send_text all \e[13;4u

# Allow remote access
# allow_remote_control yes
listen_on unix:${XDG_RUNTIME_DIR}/omarchy-kitty-{kitty_pid}

# Aesthetics
cursor_shape block
cursor_blink_interval 0
shell_integration no-cursor
enable_audio_bell no

# Minimal Tab bar styling
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
