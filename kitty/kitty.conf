# Kitty configuration.
#
# Location (see install.sh, which symlinks this file):
#   macOS and Linux alike  ~/.config/kitty/kitty.conf
#
# Kitty also reads ~/Library/Preferences/kitty/kitty.conf on macOS; if a real
# file is sitting there it wins over nothing, so keep only the ~/.config copy.

# Make the macOS Option key send Alt/Esc+ rather than composing Unicode.
# Kitty's default here is `no`, so out of the box Option+s types "ß",
# Option+w types "∑", and so on -- every Alt-based tmux binding (M-s / M-w
# session pickers, M-1..M-9 window jumps, M-S-<n> pane jumps, the M-arrow
# chords) silently turns into text instead of firing. This is the same trap
# as ghostty's `macos-option-as-alt`; see ghostty/config.
# Use `left` instead of `yes` to keep right-Option composing accents.
macos_option_as_alt yes

# SSH note: kitty's terminfo entry (xterm-kitty) does not exist on most remote
# hosts, so a plain `ssh` there dies with "missing or unsuitable terminal".
# Use `kitten ssh <host>`, which copies the entry across, or install
# kitty-terminfo remotely. See CLAUDE.md.
