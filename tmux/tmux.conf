# Use C-Space as the prefix — keeps terminal-default C-a (beginning-of-line)
# free. C-Space C-Space sends a literal C-Space through, which is how to reach
# blink.cmp's <C-space> (open completion menu / toggle docs) in nvim.
set -g prefix C-Space
set -g prefix2 C-b
# unbind C-b
unbind C-a
bind C-Space send-prefix
bind C-b send-prefix -2

# Seamless Ctrl+hjkl navigation across nvim splits AND tmux panes, provided by
# the vim-tmux-navigator plugin (below). It checks whether the focused pane is
# running nvim: if so it forwards the keystroke to nvim, otherwise it switches
# tmux panes. C-l is now navigation, so restore clear-screen on prefix + C-l:
bind C-l send-keys 'C-l'

# Reload this config into the running session. Note: sourcing is additive, not a
# reset — bindings/hooks deleted from this file stay live until the server is
# restarted. Uses R, not the conventional r, to leave prefix + r (the tmux
# default refresh-client) alone.
bind R source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"

# Enable mouse support (resize panes, click to focus, scroll)
set -g mouse on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber remaining windows when one closes (no gaps in M-1..9 jumps)
set -g renumber-windows on

# Show pane titles in border
set -g pane-border-status top
set -g pane-border-format ' #{pane_title} '

# Pane border colours: active pane stays orange, inactive borders are green so
# panes are easier to tell apart. colour208 (#ff8700) is a bright orange that
# reads well against the tokyonight background.
set -g pane-border-style 'fg=green'
set -g pane-active-border-style 'fg=colour208'
# Heavier box-drawing characters for a thicker-looking border (tmux 3.2+).
set -g pane-border-lines heavy

# Status bar: orange background (colour208, matching the pane borders) with black
# text, instead of the tmux default green.
# set -g status-style 'bg=colour208,fg=black'

# Increase scrollback buffer
set -g history-limit 50000

# Show pane numbers (prefix + q) for longer (ms); default is 1000
set -g display-panes-time 3000

# Don't wait for escape sequences (faster response in nvim)
set -sg escape-time 10

# Enable focus events so nvim can detect pane switches
set -g focus-events on

# Use vi keys in copy mode (consistent with nvim)
set -g mode-keys vi

# Clipboard integration (cross-platform)
set -g set-clipboard on
if-shell "uname | grep -q Darwin" {
  bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
  bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
  bind -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "pbcopy"
} {
  if-shell "command -v wl-copy" {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"
    bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
    bind -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "wl-copy"
  } {
    bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
    bind -T root TripleClick1Pane select-pane -t = \; copy-mode -H \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"
  }
}

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# tmux 3.6 ships a built-in feature table for iTerm2 and foot but NOT ghostty
# or kitty, so those two only get whatever their terminfo entry declares --
# which on Ubuntu's ncurses `ghostty` entry is a thin subset. Result (verified
# 2026-08 via `tmux list-clients -F '#{client_termfeatures}'`): ghostty came up
# with only bpaste,ccolour,clipboard,cstyle,focus,title -- no RGB, no 256, no
# mouse, no sync -- while iTerm2 on the same server got the full set.
# Declare them explicitly. Both terminals support all of these; sixel is
# omitted deliberately (ghostty implements the Kitty graphics protocol, not
# sixel). extkeys is listed as a capability only -- the conditional
# `extended-keys` block below still governs whether tmux requests csi-u.
set -as terminal-features ",xterm-ghostty:RGB:256:mouse:clipboard:ccolour:cstyle:focus:title:osc7:hyperlinks:strikethrough:usstyle:margins:sync:bpaste:extkeys"
set -as terminal-features ",xterm-kitty:RGB:256:mouse:clipboard:ccolour:cstyle:focus:title:osc7:hyperlinks:strikethrough:usstyle:margins:sync:bpaste:extkeys"

# Swap window left/right
bind -r S-Left swap-window -t -1\; select-window -t -1
bind -r S-Right swap-window -t +1\; select-window -t +1

# Same, prefix-free
bind -n M-S-Left swap-window -t -1\; select-window -t -1
bind -n M-S-Right swap-window -t +1\; select-window -t +1

# New named session (mirrors `prefix c` for new window)
bind C-c command-prompt -p "New session:" "new-session -s '%%'"

# Clone current window's pane layout into a new window
bind C run-shell 'tmux-clone-layout'

# Orchestrator/stream layout: shell | claude 50% | nvim (creates missing panes; max 3)
bind A run-shell '$HOME/dotfiles/bin/tmux-stream-layout "#{pane_id}"'

# Clone current window (layout, directories, commands) into a new window
bind M-c run-shell 'tmux-clone-window'

# Send the current pane into another window (side-by-side), via the
# tmux-send-pane script (dotfiles/bin). Prompts for the target: a bare
# name/index targets a window in this session; 'session:window' targets a
# window in another session; a bare session name targets that session's
# current window. #{pane_id} is expanded by run-shell (not command-prompt),
# pinning the source pane explicitly.
bind J command-prompt -p "Send pane to [session:]window:" "run-shell 'tmux-send-pane \"%1\" #{pane_id}'"

# Break the current pane out into its own new window (inverse of the merge above)
bind b break-pane

# Open the pkm vault (prefix+P or Alt+Shift+P; mirrors <leader>oP in nvim). If a 'pkm' window already
# exists in the current session, switch to it instead of opening another;
# otherwise create it. `select-window -t '=pkm'` matches the window name exactly
# in the current session and selects it (succeeds), so on failure (no such
# window) the `||` branch creates it. Vault path differs per machine: OneDrive
# on WSL (detected by the mount existing), ~/pkm on macOS and Linux.
if-shell "test -d '/mnt/c/Users/patrick.fitzgerald/OneDrive - Juvare/Documents/juvare-pkm'" {
  bind P run-shell "tmux select-window -t '=pkm' 2>/dev/null || tmux new-window -n pkm -c '/mnt/c/Users/patrick.fitzgerald/OneDrive - Juvare/Documents/juvare-pkm' nvim '/mnt/c/Users/patrick.fitzgerald/OneDrive - Juvare/Documents/juvare-pkm'"
  bind -n M-P run-shell "tmux select-window -t '=pkm' 2>/dev/null || tmux new-window -n pkm -c '/mnt/c/Users/patrick.fitzgerald/OneDrive - Juvare/Documents/juvare-pkm' nvim '/mnt/c/Users/patrick.fitzgerald/OneDrive - Juvare/Documents/juvare-pkm'"
} {
  bind P run-shell "tmux select-window -t '=pkm' 2>/dev/null || tmux new-window -n pkm -c ~/pkm nvim ~/pkm"
  bind -n M-P run-shell "tmux select-window -t '=pkm' 2>/dev/null || tmux new-window -n pkm -c ~/pkm nvim ~/pkm"
}

# --- Prefix-free Alt bindings (ported from Omarchy / DHH) ---

# Split down / split right, inheriting the current pane's directory
bind -n M-Enter split-window -v -c "#{pane_current_path}"
bind -n M-S-Enter split-window -h -c "#{pane_current_path}"

# NO M-Escape kill-pane bind — deliberately unbound. Terminals send Alt+<key> as
# two bytes, ESC then <key>, so "M-Escape" is literally ESC ESC. When two ESC
# bytes reach tmux in the same read (or within `escape-time`, 10ms, set above), tmux
# resolves them to M-Escape — so a fast double-tap of Esc, Esc key auto-repeat,
# or pasted text containing ESC ESC silently killed the pane. Double-tapping Esc
# is a trained habit from nvim (`<Esc><Esc>` exits terminal mode), which made
# this fire regularly. Verified: single ESC is safe, ESC+300ms+ESC is safe,
# ESC ESC together kills. It also never worked on Windows as a real keypress
# (Alt+Esc is an OS window-cycle shortcut), so there was nothing to lose.
# Use prefix+x to kill a pane instead. `unbind` (not just deleting the bind) so
# reloading the config with prefix+R clears it from an already-running server —
# sourcing is additive.
unbind -n M-Escape

# Prefix-based kill binds (Omarchy): x = pane, k = window, K = session.
# confirm-before on all three: these are unrecoverable (tmux has no undo for a
# killed pane — the process gets SIGHUP), and k/K sit next to the C-hjkl
# navigation keys, so a mistimed prefix turns a pane switch into a kill.
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind k confirm-before -p "kill-window #W? (y/n)" kill-window
bind K confirm-before -p "kill-session #S? (y/n)" kill-session

# Jump straight to window N
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Jump straight to pane N with Alt-Shift-N. Bound in two forms because
# terminals differ in what they send: legacy encoding gives Alt + the shifted
# symbol (Alt-Shift-1 = M-!, layout-dependent, US/AU), while CSI-u/extended-keys
# terminals report the unshifted digit + modifiers (M-S-1).
# `.N` = pane N of the current window; pane numbers are what prefix-q shows.
bind -n 'M-!' select-pane -t .1
bind -n 'M-@' select-pane -t .2
bind -n 'M-#' select-pane -t .3
bind -n 'M-$' select-pane -t .4
bind -n 'M-%' select-pane -t .5
bind -n 'M-^' select-pane -t .6
bind -n 'M-&' select-pane -t .7
bind -n 'M-*' select-pane -t .8
bind -n 'M-(' select-pane -t .9
bind -n M-S-1 select-pane -t .1
bind -n M-S-2 select-pane -t .2
bind -n M-S-3 select-pane -t .3
bind -n M-S-4 select-pane -t .4
bind -n M-S-5 select-pane -t .5
bind -n M-S-6 select-pane -t .6
bind -n M-S-7 select-pane -t .7
bind -n M-S-8 select-pane -t .8
bind -n M-S-9 select-pane -t .9

# Resize the current pane (5 cells per press, Omarchy defaults)
bind -n C-M-S-Left resize-pane -L 5
bind -n C-M-S-Down resize-pane -D 5
bind -n C-M-S-Up resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Previous/next window — the prefix p/n keys with Alt instead of prefix. Takes
# Alt+p from TUIs in the pane (Claude Code's model picker; use /model instead).
bind -n M-p previous-window
bind -n M-n next-window

# Previous/next session
bind -n M-Up switch-client -p
bind -n M-Down switch-client -n

# Most-recent pane/window/session — the prefix keys (;/l/L) with Alt instead of
# prefix, except last-session: M-L is directional pane-swap (below), so that one
# is C-M-l. C-M-L is the same binding — tmux folds Shift into the letter for Ctrl
# chords — so Shift is optional. Ctrl+Alt+L is the lock screen on KDE and some
# GNOME/Hyprland setups and never reaches tmux there; prefix + L is the built-in
# switch-client -l either way. herdr uses ctrl+alt+l for focus-pane-right.
bind -n 'M-;' last-pane
bind -n M-l last-window
bind -n C-M-l switch-client -l

# Swap the current pane with the directionally adjacent one, prefix-free. The
# {left-of}/{down-of}/{up-of}/{right-of} pane targets (tmux 3.1+) are what make
# this directional — plain swap-pane only walks the pane list (-U/-D). -d keeps
# the same pane active, so focus travels with the content rather than staying in
# the vacated slot. With no pane in that direction tmux shows "can't find pane"
# and does nothing. The hjkl set mirrors herdr's swap_pane_* (prefix+shift+hjkl);
# the arrows are equivalent, but Windows Terminal binds alt+shift+arrow to
# resizePane by default, so under WSL they need that binding removed in WT.
bind -n M-H swap-pane -d -t '{left-of}'
bind -n M-J swap-pane -d -t '{down-of}'
bind -n M-K swap-pane -d -t '{up-of}'
bind -n M-L swap-pane -d -t '{right-of}'
bind -n M-S-Left swap-pane -d -t '{left-of}'
bind -n M-S-Down swap-pane -d -t '{down-of}'
bind -n M-S-Up swap-pane -d -t '{up-of}'
bind -n M-S-Right swap-pane -d -t '{right-of}'

# Prefix-free tree pickers. These are additions — the prefix versions
# (prefix s / prefix w) stay bound to the tmux defaults.
#   M-s  sessions, collapsed
#   M-w  every session expanded to its windows (same as prefix w)
#   M-W  windows of the current session only
#
# M-W goes via run-shell because #{client_session} does NOT resolve inside
# choose-tree's -f filter (verified 2026-07: the filter matched nothing, so
# M-W listed every session, same as M-w). run-shell expands #{session_name}
# against the current pane before the inner tmux runs, so the session name is
# a literal by the time choose-tree sees it; ##{...} escapes the format syntax
# that must survive to the inner command. -t #{pane_id} gives it a client.
bind -n M-s choose-tree -Zs
bind -n M-w choose-tree -Zw
bind -n M-W run-shell -b "tmux choose-tree -Zw -t '#{pane_id}' -f '##{==:##{session_name},#{session_name}}'"

# Extended key reporting (csi-u). Needed so the terminal can distinguish
# M-S-Enter from M-Enter, and so TUIs like Claude Code get a real Shift+Enter.
#
# It is ON by default (correct for kitty / ghostty / alacritty / wezterm) but
# turned OFF under iTerm2, which accepts tmux's CSI-u request and then swallows
# Option+Shift chords entirely — Alt-Shift-1..9 pane jumps never arrive
# (verified 2026-07 on macOS: M-! fires with this off, nothing fires with it
# on). Cost under iTerm2: legacy encoding sends M-S-Enter as plain M-Enter.
# Workaround in use there — an iTerm2 profile key mapping for Alt-Shift-Enter
# sends the csi-u sequence Esc [13;4u directly, and tmux always parses csi-u on
# *input* even with extended-keys off, so the M-S-Enter bind still fires.
# (Fallback splits: prefix % side-by-side, prefix " stacked.)
#
# CAVEAT: if-shell runs at config-load time against the tmux *server's*
# environment, so TERM_PROGRAM reflects whichever client first started the
# server. Attaching the same server from both iTerm2 and ghostty will get
# whichever won. Force it for the session with
# `tmux set -g extended-keys on|off` if a mixed-client session misbehaves.
if-shell -b '[ "$TERM_PROGRAM" = "iTerm.app" ]' \
  'set -g extended-keys off' \
  'set -g extended-keys on'
# extended-keys-format only exists in tmux >= 3.5 (csi-u is already the effective
# behaviour of `extended-keys on` on 3.4). Version-gate it so older tmux doesn't
# error "invalid option: extended-keys-format" on reload. Uses tmux's own %if
# rather than if-shell: the shell form needs nested quotes and a printf newline
# escape that tmux's config parser mangles, so it silently never fired.
%if #{>=:#{version},3.5}
set -g extended-keys-format csi-u
%endif

# Window names are manual only. automatic-rename off stops tmux renaming a
# window after the active pane's cwd/command; allow-rename off stops programs
# in the pane doing it via escape sequences. Name a window with `prefix ,` or
# `new-window -n <name>` (e.g. the pkm window).
setw -g automatic-rename off
set -g allow-rename off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
# Re-launch these processes with their full command line on restore.
# nvim/node/claude aren't in the default whitelist with args, so without this
# they come back as bare `nvim`/etc. (or not at all for claude).
set -g @resurrect-processes '"~nvim *" "~claude *" "~node *" ssh'

# Continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Switch to another active session upon destroying a session
# (killing the last window for instance) instead of detaching
set -g detach-on-destroy off

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
