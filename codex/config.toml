# Codex CLI adapter. Symlinked to ~/.codex/config.toml by install.sh.
#
# Instructions are NOT configured here -- install.sh symlinks
# ~/.codex/AGENTS.md -> ~/dotfiles/ai/AGENTS.md, which is where Codex reads
# user-level instructions from. Skills/commands: Codex has no skills system;
# ~/.codex/prompts/*.md are its slash commands, symlinked from ai/commands/.
#
# Model/approval settings still default (unset here) -- fill in when you want
# to pin them explicitly. MCP servers come from `ai/bin/sync-mcp.sh` output.

# model = "gpt-5-codex"
# approval_policy = "on-request"

